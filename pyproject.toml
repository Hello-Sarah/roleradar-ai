[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roleradar-ai"
version = "0.1.0"
description = "Explainable career intelligence for applied AI professionals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=1.52,<2",
  "pandas>=2.2,<3",
  "pypdf>=5.0,<7",
  "psycopg[binary]>=3.2,<4",
  "python-docx>=1.1,<2",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "sqlalchemy>=2.0,<3",
  "streamlit>=1.39,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "playwright>=1.55,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "pytest-playwright>=0.7,<1",
  "ruff>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --cov --cov-report=term-missing"
testpaths = ["tests"]
norecursedirs = ["tests/e2e"]

[tool.coverage.run]
source = ["app"]
relative_files = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
