services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: roleradar
      POSTGRES_USER: roleradar
      POSTGRES_PASSWORD: roleradar
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roleradar"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://roleradar:roleradar@db:5432/roleradar
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  dashboard:
    build: .
    command: ["streamlit", "run", "app/dashboard/streamlit_app.py", "--server.address=0.0.0.0"]
    environment:
      API_BASE_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]
volumes:
  postgres_data:

